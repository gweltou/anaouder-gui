name: Package macOS version on intel architecture

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package:
    # macos-13 runners have been retired; macos-15-intel is the remaining Intel (x86_64) image
    runs-on: macos-15-intel
    permissions:
      contents: write  # Needed to create the GitHub release on tags
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check that the tag matches the pyproject.toml version
        # File names use the pyproject.toml version, so a mismatched tag would publish wrong names
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match pyproject.toml version $VERSION"
            exit 1
          fi

      - name: Set up a virtual environment
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$(pwd)/.venv" >> $GITHUB_ENV
          echo "$(pwd)/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[build]"

      - name: Download ffmpeg
        run: |
          python -c "import static_ffmpeg; static_ffmpeg.add_paths()"

      - name: Compile language translation files
        run: |
          pyside6-lrelease translations/anaouder_fr.ts -qm translations/anaouder_fr.qm
          pyside6-lrelease translations/anaouder_br.ts -qm translations/anaouder_br.qm

      - name: Build with PyInstaller
        env:
          ARCH: x86_64
          DEBUG: 'False'
        run: |
          pyinstaller anaouder.spec

      - name: Zip the app bundle
        # upload-artifact doesn't preserve the symlinks and permissions of a .app bundle,
        # so it is zipped with ditto first
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          ditto -c -k --keepParent dist/Anaouder.app "dist/Anaouder-${VERSION}_macOS-x86.zip"

      - name: Upload built application
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/*.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
