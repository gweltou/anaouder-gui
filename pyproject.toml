[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "anaouder-gui"
version = "1.2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.28",
    "pyside6>=6.9",
    "static-ffmpeg==3.0",
    "pydub>=0.25,<0.26",
    "audioop-lts; python_version>='3.13'",
    "vosk>=0.3.44",
    "srt>=3.5,<4",
    "pillow>=12.0",
    "ostilhou @ git+https://github.com/gweltou/ostilhou",
    "striprtf",
    "spylls>=0.1.7",
]


[project.optional-dependencies]
# Only needed to build the standalone executables:
#   pip install -e ".[build]"
build = [
    "pyinstaller>=6.12",
]

[tool.setuptools.packages.find]
include = ["anaouder*"]
